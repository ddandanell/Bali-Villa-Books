<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f1c" />
    <meta name="format-detection" content="telephone=no" />

    <title>Bali Accounting — Monthly Bookkeeping for Bali Villa Owners</title>
    <meta name="description" content="Monthly bookkeeping for Bali villa owners. One clear report by the 15th — revenue, expenses, profit. Airbnb, Booking.com, staff payroll, all in Indonesian Rupiah. WhatsApp Abel directly." />
    <meta name="robots" content="index, follow" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0b1f1c" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bali Accounting — Monthly Bookkeeping for Bali Villa Owners" />
    <meta property="og:description" content="One clear monthly report. Revenue, expenses, profit — all in Indonesian Rupiah. WhatsApp Abel: +62 812-3740-2292." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bali Accounting — Monthly Bookkeeping for Bali Villa Owners" />
    <meta name="twitter:description" content="One clear monthly report. Revenue, expenses, profit — all in Indonesian Rupiah. WhatsApp Abel: +62 812-3740-2292." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Structured data: Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Bali Accounting",
      "description": "Monthly bookkeeping service for Bali villa owners. Clear reports in plain English. Revenue, expenses, profit, staff payroll — all in Indonesian Rupiah.",
      "telephone": "+6281237402292",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Jl. Tukad Barito Timur III No.16, Panjer",
        "addressLocality": "Denpasar Selatan",
        "addressRegion": "Bali",
        "postalCode": "80226",
        "addressCountry": "ID"
      },
      "areaServed": {
        "@type": "Place",
        "name": "Bali, Indonesia"
      },
      "priceRange": "Rp 2.500.000 – Rp 8.500.000 / month",
      "currenciesAccepted": "IDR",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Villa Bookkeeping Packages",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Starter",
            "description": "Monthly bookkeeping for 1 villa, up to 2 booking channels, basic P&L report.",
            "price": "2500000",
            "priceCurrency": "IDR",
            "priceSpecification": {
              "@type": "RecurringCharge",
              "billingDuration": "P1M"
            }
          },
          {
            "@type": "Offer",
            "name": "Professional",
            "description": "Full owner financial report, staff payroll and BPJS tracking, all booking channels, monthly review call.",
            "price": "5000000",
            "priceCurrency": "IDR",
            "priceSpecification": {
              "@type": "RecurringCharge",
              "billingDuration": "P1M"
            }
          },
          {
            "@type": "Offer",
            "name": "Premium",
            "description": "Tax pack for Konsultan Pajak, annual position summary, forecast vs actuals, priority support.",
            "price": "8500000",
            "priceCurrency": "IDR",
            "priceSpecification": {
              "@type": "RecurringCharge",
              "billingDuration": "P1M"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
