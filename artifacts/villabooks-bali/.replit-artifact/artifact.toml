kind = "web"
previewPath = "/"
title = "VillaBooks Bali"
version = "1.0.0"
id = "artifacts/villabooks-bali"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18253

[services.development]
run = "pnpm --filter @workspace/villabooks-bali run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/villabooks-bali", "run", "build" ]
run = [ "node", "artifacts/villabooks-bali/server.mjs" ]

[services.env]
PORT = "18253"
BASE_PATH = "/"
