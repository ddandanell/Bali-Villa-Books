name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve keyword ownership against the previous base
        env:
          SEO_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SEO_BASE_REF" ] && [ "$SEO_BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            node scripts/src/seo-autopilot.mjs check --base-ref "$SEO_BASE_REF"
          else
            node scripts/src/seo-autopilot.mjs check
          fi
      - run: pnpm check
