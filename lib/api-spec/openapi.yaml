openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: blog
    description: SEO blog content and automation
paths:
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [blog]
      summary: Save an enquiry and prepare a WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Saved enquiry; user must send the WhatsApp message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: Invalid enquiry
        "429":
          description: Too many enquiries
  /site-events:
    post:
      operationId: recordSiteEvent
      tags: [blog]
      summary: Record a privacy-safe website interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteEventInput"
      responses:
        "204":
          description: Event recorded
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Published posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPostSummary"
  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a published blog post
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Post not found
  /blog/events:
    post:
      operationId: recordBlogEvent
      tags: [blog]
      summary: Record a privacy-safe content event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogEventInput"
      responses:
        "204":
          description: Event recorded
  /blog/automation/status:
    get:
      operationId: getBlogAutomationStatus
      tags: [blog]
      summary: Get public automation status
      responses:
        "200":
          description: Automation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogAutomationStatus"
components:
  schemas:
    EnquiryInput:
      type: object
      required: [name, contact, propertyCount, location, issue, consent]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        contact:
          type: string
          minLength: 5
          maxLength: 150
        propertyCount:
          type: integer
          minimum: 1
          maximum: 100
        location:
          type: string
          minLength: 2
          maxLength: 100
        issue:
          type: string
          minLength: 10
          maxLength: 2000
        bookingChannels:
          type: string
          maxLength: 200
        preferredPackage:
          type: string
          maxLength: 80
        sourcePage:
          type: string
          maxLength: 150
        consent:
          type: boolean
        website:
          type: string
          maxLength: 200
          description: Leave blank; spam detection field
    EnquiryReceipt:
      type: object
      required: [reference, whatsappUrl, message]
      properties:
        reference:
          type: string
        whatsappUrl:
          type: string
        message:
          type: string
    SiteEventInput:
      type: object
      required: [eventType, page, placement]
      properties:
        eventType:
          type: string
          enum: [whatsapp_click, phone_click, consultation_click, enquiry_submitted, sample_report_view, sample_report_download, blog_view, article_completion]
        page:
          type: string
          maxLength: 150
        placement:
          type: string
          maxLength: 80
        service:
          type: string
          maxLength: 80
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BlogPostSummary:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        primaryKeyword:
          type: string
        imageUrl:
          type: string
        imageAlt:
          type: string
        category:
          type: string
        readTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
      required: [slug, title, excerpt, primaryKeyword, category, readTimeMinutes, publishedAt, imageUrl, imageAlt]
    BlogPost:
      allOf:
        - $ref: "#/components/schemas/BlogPostSummary"
        - type: object
          properties:
            metaTitle:
              type: string
            metaDescription:
              type: string
            contentHtml:
              type: string
            updatedAt:
              type: string
              format: date-time
            wordCount:
              type: integer
            relatedPosts:
              type: array
              items:
                $ref: "#/components/schemas/BlogPostSummary"
          required: [metaTitle, metaDescription, contentHtml, relatedPosts, updatedAt, wordCount]
    BlogEventInput:
      type: object
      properties:
        slug:
          type: string
        eventType:
          type: string
          enum: [article_view, article_cta_click, article_scroll_complete]
      required: [slug, eventType]
    BlogAutomationStatus:
      type: object
      properties:
        enabled:
          type: boolean
        cadence:
          type: string
        maxPostsPerRun:
          type: integer
        publishedPosts:
          type: integer
        timezone:
          type: string
        scheduledHour:
          type: integer
        minimumWords:
          type: integer
        lastRunStatus:
          type: [string, "null"]
        lastReviewAt:
          type: [string, "null"]
          format: date-time
        lastRunAt:
          type: [string, "null"]
          format: date-time
        nextEligibleRunAt:
          type: [string, "null"]
          format: date-time
      required: [enabled, cadence, maxPostsPerRun, publishedPosts, lastRunAt, nextEligibleRunAt, timezone, scheduledHour, minimumWords, lastRunStatus, lastReviewAt]

